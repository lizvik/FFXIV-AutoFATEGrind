name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  # Cheap metadata and localization gates that don't need Dalamud.
  guards:
    name: Guards (metadata)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify version metadata
        shell: bash
        run: |
          build_ver=$(grep -oP '<Version>\K[\d.]+(?=</Version>)' Directory.Build.props)
          if [[ ! "$build_ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Directory.Build.props <Version> ($build_ver) must have four parts (Major.Minor.Build.Revision)."
            exit 1
          fi
          jq empty repo.json
          echo "Directory.Build.props <Version> = $build_ver"
          echo "repo.json release metadata is updated by release.yml after publishing."

      # Every language catalog must carry exactly the keys of en.json, and the
      # copy rules ban em dashes in the string table and the catalogs.
      - name: Verify localization catalogs
        shell: bash
        run: |
          dir=AutoFateGrind/Localization
          for f in "$dir"/*.json; do
            jq empty "$f" || { echo "::error::$f is not valid JSON"; exit 1; }
          done
          jq -r 'keys_unsorted[]' "$dir/en.json" > /tmp/en.keys
          for code in de es fr ja pt ru tr zh; do
            jq -r 'keys_unsorted[]' "$dir/$code.json" > "/tmp/$code.keys"
            if ! diff -q /tmp/en.keys "/tmp/$code.keys" > /dev/null; then
              echo "::error::$code.json keys differ from en.json (same keys, same order required):"
              diff /tmp/en.keys "/tmp/$code.keys" || true
              exit 1
            fi
          done
          dash=$(printf '\xe2\x80\x94')
          offenders=$(grep -n -F -- "$dash" "$dir"/*.json AutoFateGrind/Core/Localization/L.cs || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::No em dashes in L.cs or the language catalogs. Use commas, colons, or parentheses."
            exit 1
          fi

  # Full build. Needs Dalamud present at the standard plugin path so
  # Dalamud.NET.Sdk can resolve $(DalamudLibPath).
  build:
    name: Build (Windows)
    needs: guards
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud dev build
        shell: pwsh
        run: |
          $dalamudUrl = "https://goatcorp.github.io/dalamud-distrib/latest.zip"
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri $dalamudUrl -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Restore
        run: dotnet restore AutoFateGrind.sln

      - name: Build (Release)
        run: dotnet build AutoFateGrind.sln --configuration Release --no-restore

      - name: Find test projects
        id: find_tests
        shell: bash
        run: |
          if find . -name "*.Tests.csproj" -o -name "*.Test.csproj" 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.find_tests.outputs.found == 'true'
        run: dotnet test AutoFateGrind.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Upload plugin artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: AutoFateGrind-plugin
          path: AutoFateGrind/bin/Release/AutoFateGrind/latest.zip
          if-no-files-found: warn
